# ==============================================================
# EasyTestWeb - Framework Configuration
# ==============================================================

# Browser: chromium, firefox, webkit, chrome, msedge
browser=chromium

# Headless mode: true or false
headless=true

# Target Application Base URL
baseUrl=https://www.saucedemo.com

# Timeout in milliseconds (30 seconds)
timeout=30000

# Slow motion delay between actions (in milliseconds)
slowMo=0

# Viewport settings
viewportWidth=1920
viewportHeight=1080

# Capture Tracing: true or false (saved on test completion or failure)
tracing=true

# Record Video: true or false
video=false

# Take Screenshot on failure: true or false
screenshotOnFailure=true
